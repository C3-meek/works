<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務日報</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F6F3;--surface:#FFFFFF;--border:#E5E2DC;--border2:#CCCAC4;
  --text:#1A1A18;--text2:#6B6860;--text3:#9B9890;
  --accent:#1D9E75;--accent-light:#E1F5EE;--accent-text:#085041;
  --red:#D85A30;--red-light:#FAECE7;
  --amber:#BA7517;--amber-light:#FAEEDA;
  --blue:#185FA5;
  --sidebar-w:220px;
  --font:'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif;
  --radius:10px;--shadow:0 2px 14px rgba(0,0,0,0.07);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}

/* ===== SETUP ===== */
.setup-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:36px 40px;width:100%;max-width:500px}
.setup-card h2{font-size:18px;font-weight:700;margin-bottom:6px}
.setup-card .desc{font-size:13px;color:var(--text2);margin-bottom:26px;line-height:1.7}
.setup-field{margin-bottom:14px}
.setup-field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:0.05em;text-transform:uppercase}
.setup-field input{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:7px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border-color 0.15s}
.setup-field input:focus{border-color:var(--accent);background:var(--surface)}
.setup-hint{font-size:11px;color:var(--text3);margin-top:4px}
.setup-hint code{background:#F0EDE7;padding:1px 5px;border-radius:3px;font-size:10.5px}
.setup-error{background:var(--red-light);border:1px solid #F0997B;border-radius:7px;padding:10px 14px;font-size:12px;color:var(--red);margin-top:12px;display:none;white-space:pre-wrap}

/* ===== APP SHELL ===== */
.app-shell{display:flex;height:100vh;overflow:hidden}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:14px;font-weight:700;letter-spacing:0.01em}
.sidebar-header .sync-row{display:flex;align-items:center;gap:5px;margin-top:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background 0.3s}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
.sync-dot.ok{background:var(--accent)}
.sync-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.sync-label{font-size:10.5px;color:var(--text3)}

.sidebar-section{padding:10px 12px 4px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase}
.client-list{flex:1;overflow-y:auto;padding:4px 8px}
.client-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all 0.12s;margin-bottom:2px;border:1px solid transparent}
.client-item:hover{background:var(--bg)}
.client-item.active{background:var(--accent-light);border-color:#9FE1CB}
.client-avatar{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff}
.client-name{font-size:12.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-item.active .client-name{color:var(--accent-text);font-weight:600}
.client-count{font-size:10px;color:var(--text3);margin-left:auto;flex-shrink:0}
.client-item.active .client-count{color:var(--accent)}

.sidebar-footer{padding:10px 8px;border-top:1px solid var(--border)}
.add-client-btn{width:100%;background:none;border:1.5px dashed var(--border2);border-radius:8px;padding:7px;cursor:pointer;font-size:12px;color:var(--text2);font-family:var(--font);transition:all 0.12s}
.add-client-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.settings-btn{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;padding:7px 10px;cursor:pointer;font-size:11.5px;color:var(--text3);font-family:var(--font);border-radius:6px;margin-top:4px}
.settings-btn:hover{background:var(--bg);color:var(--text2)}

/* ===== MAIN CONTENT ===== */
.main-content{flex:1;overflow-y:auto;display:flex;flex-direction:column}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.top-bar-left{display:flex;align-items:center;gap:10px}
.client-badge{display:flex;align-items:center;gap:8px}
.client-badge-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.client-badge-name{font-size:15px;font-weight:700}
.client-badge-meta{font-size:11.5px;color:var(--text3)}
.top-bar-actions{display:flex;gap:8px}

.content-grid{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px 24px;align-items:start;flex:1}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:12.5px;font-family:var(--font);cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:all 0.13s;white-space:nowrap}
.btn:hover{background:#F0EDE7;border-color:#B8B5AE}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:#0F6E56;border-color:#0F6E56}
.btn-danger{background:var(--red-light);border-color:#F0997B;color:var(--red)}
.btn-danger:hover{background:#F5C4B3}
.btn-sm{padding:5px 10px;font-size:12px}

/* ===== CALENDAR ===== */
.calendar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all 0.1s}
.cal-nav-btn:hover{background:var(--bg)}
.cal-title{font-size:13px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:10px;color:var(--text3);padding:4px 0;font-weight:600}
.cal-dow:first-child{color:#D85A30}
.cal-dow:last-child{color:#185FA5}
.cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:11.5px;cursor:pointer;transition:all 0.1s;border:1px solid transparent;user-select:none}
.cal-day:hover{background:var(--accent-light);border-color:#9FE1CB}
.cal-day.other-month{color:var(--text3)}
.cal-day.today{font-weight:800;color:var(--accent);border-color:var(--accent)}
.cal-day.selected{background:var(--accent);color:#fff!important;font-weight:700;border-color:var(--accent)}
.cal-day.selected:hover{background:#0F6E56}
.cal-day.has-report::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent)}
.cal-day.selected.has-report::after{background:rgba(255,255,255,0.7)}
.cal-day.sunday:not(.other-month){color:#D85A30}
.cal-day.saturday:not(.other-month){color:#185FA5}

.report-stats{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat-item{text-align:center;background:var(--bg);border-radius:7px;padding:7px 4px}
.stat-num{font-size:18px;font-weight:700;color:var(--accent)}
.stat-label{font-size:10px;color:var(--text3);margin-top:1px}

/* ===== FORM ===== */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.form-date-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.form-date-label{font-size:15px;font-weight:700}
.form-date-sub{font-size:11.5px;color:var(--text2);margin-top:3px}
.badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600}
.badge-submitted{background:var(--accent-light);color:var(--accent-text)}
.badge-draft{background:var(--amber-light);color:var(--amber)}
.form-section{margin-bottom:14px}
.form-section label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;letter-spacing:0.05em;text-transform:uppercase}
.form-section input[type=text],.form-section input[type=time],.form-section textarea{width:100%;padding:8px 11px;border:1px solid var(--border2);border-radius:7px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);transition:border-color 0.15s,background 0.15s;outline:none;resize:vertical}
.form-section input:focus,.form-section textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(29,158,117,0.1)}
.form-section textarea{min-height:68px;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-row .form-section{margin-bottom:0}
.task-list{list-style:none;margin-bottom:7px}
.task-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;margin-bottom:4px;background:var(--bg)}
.task-item.done-item{opacity:0.5}
.task-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.task-txt{flex:1;border:none;background:none;padding:0;font-size:13px;color:var(--text);outline:none;font-family:var(--font)}
.task-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:0;line-height:1;width:18px;text-align:center}
.task-del:hover{color:var(--red)}
.add-task-btn{background:none;border:1.5px dashed var(--border2);border-radius:7px;width:100%;padding:6px;cursor:pointer;font-size:12px;color:var(--text2);font-family:var(--font);transition:all 0.1s}
.add-task-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.time-row{display:flex;align-items:center;gap:7px}
.time-row input{width:110px!important;flex-shrink:0}
.time-sep{color:var(--text2)}
.time-calc{font-size:12px;color:var(--accent);font-weight:600;margin-left:4px}
.form-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}

/* ===== EMPTY / NO CLIENT ===== */
.empty-state{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-icon{font-size:42px;margin-bottom:12px;display:block}
.empty-state p{font-size:13px;line-height:1.8}

/* ===== MODALS ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:12px;padding:24px;width:360px;box-shadow:0 8px 40px rgba(0,0,0,0.15)}
.modal h3{font-size:15px;font-weight:700;margin-bottom:10px}
.modal p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:16px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:0.05em;text-transform:uppercase}
.modal-field input{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:7px;font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);outline:none}
.modal-field input:focus{border-color:var(--accent);background:var(--surface)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* color swatches */
.color-swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.swatch{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all 0.1s}
.swatch:hover{transform:scale(1.15)}
.swatch.selected{border-color:var(--text);transform:scale(1.1)}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;right:24px;background:#1A1A18;color:#fff;padding:10px 17px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.18)}
.toast.show{opacity:1}

@media print{
  /* 非表示にする UI 要素 */
  .sidebar,.top-bar-actions,.form-actions,.add-task-btn,.task-del,
  .cal-nav-btn,.sidebar-footer,.modal-overlay,.toast{display:none!important}

  /* レイアウトリセット */
  html,body{height:auto!important;overflow:visible!important}
  .app-shell{display:block!important;height:auto!important;overflow:visible!important}
  .main-content{overflow:visible!important;height:auto!important}
  .content-grid{display:block!important;padding:0!important;height:auto!important;overflow:visible!important}
  .calendar-card,.report-stats{display:none!important}
  .form-card{box-shadow:none!important;border:none!important;padding:0!important;height:auto!important;overflow:visible!important}
  .top-bar{border:none!important;padding:0 0 12px!important}

  /* textarea: 内容に応じて高さを自動伸長させる核心部分 */
  textarea{
    display:block!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    overflow:visible!important;
    overflow-y:visible!important;
    border:none!important;
    background:transparent!important;
    padding:0!important;
    resize:none!important;
    white-space:pre-wrap!important;
    word-break:break-word!important;
    /* Firefox / Chrome でテキストが全て展開されるよう強制 */
    field-sizing:content;
  }

  /* input はそのまま1行表示 */
  input[type=text],input[type=time]{
    border:none!important;
    background:transparent!important;
    padding:0!important;
  }

  /* セクション・フォームの高さを自動に */
  .form-section{height:auto!important;overflow:visible!important;margin-bottom:12px!important}
  .form-row{height:auto!important;overflow:visible!important}
  .task-item{border:none!important;background:transparent!important;padding:2px 0!important}

  /* ページ内で途中切断を防ぐ */
  .form-section{page-break-inside:avoid}
}
</style>
</head>
<body>

<!-- ===== SETUP ===== -->
<div id="setup-wrap" class="setup-wrap" style="display:none">
  <div class="setup-card">
    <h2>🔧 Supabase 設定</h2>
    <p class="desc">Supabase の接続情報を入力してください。<br>入力内容はこのブラウザにのみ保存されます。</p>
    <div class="setup-field">
      <label>Project URL</label>
      <input type="text" id="setup-url" placeholder="https://xxxxxxxxxxxx.supabase.co">
      <div class="setup-hint">ダッシュボード → Settings → API → Project URL</div>
    </div>
    <div class="setup-field">
      <label>Anon Key (public)</label>
      <input type="text" id="setup-key" placeholder="eyJhbGci...">
      <div class="setup-hint">同ページの <code>anon</code> <code>public</code> キー</div>
    </div>
    <div class="setup-error" id="setup-error"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-primary" onclick="connectSupabase()">接続する</button>
    </div>
  </div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app-shell" class="app-shell" style="display:none">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>📋 業務日報</h1>
      <div class="sync-row">
        <span class="sync-dot" id="sync-dot"></span>
        <span class="sync-label" id="sync-label">接続中...</span>
      </div>
    </div>
    <div class="sidebar-section">クライアント</div>
    <div class="client-list" id="client-list"></div>
    <div class="sidebar-footer">
      <button class="add-client-btn" onclick="openAddClient()">＋ クライアントを追加</button>
      <button class="settings-btn" onclick="resetSettings()">⚙ 接続設定を変更</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-content">
    <div class="top-bar">
      <div class="top-bar-left" id="top-bar-left">
        <div style="color:var(--text3);font-size:13px">クライアントを選択してください</div>
      </div>
      <div class="top-bar-actions">
        <button class="btn btn-sm" onclick="exportMonthPDF()">📄 月次PDF</button>
        <button class="btn btn-sm btn-primary" onclick="printCurrent()">🖨 印刷</button>
      </div>
    </div>

    <div class="content-grid">
      <div>
        <div class="calendar-card">
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
            <span class="cal-title" id="cal-title">—</span>
            <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="report-stats">
            <div class="stat-item"><div class="stat-num" id="stat-count">—</div><div class="stat-label">今月の日報</div></div>
            <div class="stat-item"><div class="stat-num" id="stat-hours">—</div><div class="stat-label">稼働時間</div></div>
            <div class="stat-item"><div class="stat-num" id="stat-tasks">—</div><div class="stat-label">完了タスク</div></div>
          </div>
        </div>
      </div>
      <div class="form-card" id="form-area">
        <div class="empty-state">
          <span class="empty-icon">👈</span>
          <p>左のサイドバーから<br>クライアントを選んでください</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD/EDIT CLIENT MODAL -->
<div class="modal-overlay" id="client-modal">
  <div class="modal">
    <h3 id="client-modal-title">クライアントを追加</h3>
    <div class="modal-field">
      <label>会社名・クライアント名</label>
      <input type="text" id="cm-name" placeholder="○○株式会社" maxlength="40">
    </div>
    <div class="modal-field">
      <label>略称（アバター表示用・2文字）</label>
      <input type="text" id="cm-abbr" placeholder="○○" maxlength="2">
    </div>
    <div class="modal-field">
      <label>カラー</label>
      <div class="color-swatches" id="color-swatches"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="closeClientModal()">キャンセル</button>
      <button class="btn btn-sm" id="cm-delete-btn" style="display:none" onclick="deleteClient()">🗑 削除</button>
      <button class="btn btn-sm btn-primary" onclick="saveClient()">保存</button>
    </div>
  </div>
</div>

<!-- DELETE REPORT MODAL -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h3>⚠️ 日報を削除しますか？</h3>
    <p>この操作は取り消せません。<br>Supabase 上のデータも削除されます。</p>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="closeDeleteModal()">キャンセル</button>
      <button class="btn btn-sm btn-danger" onclick="confirmDelete()">削除する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==============================
   CONSTANTS
   ============================== */
const COLORS = [
  '#1D9E75','#185FA5','#D85A30','#BA7517',
  '#7F77DD','#993556','#639922','#5F5E5A',
  '#0F6E56','#993C1D'
];
const CONFIG_KEY  = 'nippo_sb_config';
const CLIENTS_KEY = 'nippo_clients';
const DOW = ['日','月','火','水','木','金','土'];
const MO  = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

/* ==============================
   STATE
   ============================== */
let SB_URL = '', SB_KEY = '';
let clients   = [];       // [{id,name,abbr,color}, ...]
let activeClient = null;  // client obj
let curYear, curMonth, selectedDate = null, tasks = [];
let monthCache = {};      // "clientId:YYYY-MM" → {dateStr: row}
const now = new Date();
const todayStr = fd(now);
curYear  = now.getFullYear();
curMonth = now.getMonth();

/* ==============================
   UTILS
   ============================== */
function fd(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}` }
function p2(n){ return String(n).padStart(2,'0') }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d) }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function sh(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
function labelDate(ds){
  const dt=parseDate(ds);
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日（${DOW[dt.getDay()]}）`
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}
function setSyncStatus(state,label){
  const d=document.getElementById('sync-dot'), l=document.getElementById('sync-label');
  if(!d) return;
  d.className='sync-dot '+state; l.textContent=label;
}

/* ==============================
   CONFIG / CLIENTS PERSISTENCE
   ============================== */
function loadConfig(){ try{ return JSON.parse(localStorage.getItem(CONFIG_KEY)); }catch{ return null; } }
function saveConfig(url,key){ localStorage.setItem(CONFIG_KEY,JSON.stringify({url:url.replace(/\/$/,''),key})); }
function loadClients(){ try{ return JSON.parse(localStorage.getItem(CLIENTS_KEY))||[]; }catch{ return []; } }
function persistClients(){ localStorage.setItem(CLIENTS_KEY,JSON.stringify(clients)); }
function resetSettings(){
  if(!confirm('設定をリセットして再設定画面に戻りますか？\nデータは Supabase に残ります。')) return;
  localStorage.removeItem(CONFIG_KEY);
  monthCache={};
  document.getElementById('app-shell').style.display='none';
  document.getElementById('setup-wrap').style.display='flex';
}

/* ==============================
   SUPABASE API
   ============================== */
async function sbFetch(path, opts={}){
  const res = await fetch(`${SB_URL}/rest/v1${path}`,{
    ...opts,
    headers:{
      'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,
      'Content-Type':'application/json',
      'Prefer': opts.prefer||'',
      ...(opts.headers||{})
    }
  });
  return res;
}
async function sbSelect(clientId, dateStr){
  const r=await sbFetch(`/daily_reports?client_id=eq.${clientId}&date_str=eq.${dateStr}&select=*`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  const rows=await r.json(); return rows[0]||null;
}
async function sbUpsert(data){
  const r=await sbFetch('/daily_reports',{
    method:'POST', prefer:'resolution=merge-duplicates,return=representation',
    body:JSON.stringify(data)
  });
  if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.message||`HTTP ${r.status}`); }
  return r.json();
}
async function sbDelete(clientId, dateStr){
  const r=await sbFetch(`/daily_reports?client_id=eq.${clientId}&date_str=eq.${dateStr}`,{method:'DELETE'});
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
}
async function sbSelectMonth(clientId, y, m){
  const from=`${y}-${p2(m+1)}-01`, to=`${y}-${p2(m+1)}-31`;
  const r=await sbFetch(`/daily_reports?client_id=eq.${clientId}&date_str=gte.${from}&date_str=lte.${to}&select=*&order=date_str.asc`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
async function sbSelectAllMonth(y, m){
  const from=`${y}-${p2(m+1)}-01`, to=`${y}-${p2(m+1)}-31`;
  const r=await sbFetch(`/daily_reports?date_str=gte.${from}&date_str=lte.${to}&select=*&order=client_id.asc,date_str.asc`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

/* ==============================
   CACHE
   ============================== */
function cacheKey(clientId,y,m){ return `${clientId}:${y}-${p2(m+1)}` }
async function loadMonth(clientId,y,m){
  const ck=cacheKey(clientId,y,m);
  if(monthCache[ck]) return monthCache[ck];
  setSyncStatus('syncing','読み込み中...');
  try{
    const rows=await sbSelectMonth(clientId,y,m);
    const map={}; rows.forEach(r=>{ map[r.date_str]=r; });
    monthCache[ck]=map;
    setSyncStatus('ok','Supabase 接続済');
    return map;
  }catch(e){ setSyncStatus('error','接続エラー'); throw e; }
}
function getCached(clientId,ds){
  const [y,mo]=ds.split('-').map(Number);
  const ck=cacheKey(clientId,y,mo-1);
  return monthCache[ck]?.[ds]||null;
}
function setCached(clientId,ds,row){
  const [y,mo]=ds.split('-').map(Number);
  const ck=cacheKey(clientId,y,mo-1);
  if(!monthCache[ck]) monthCache[ck]={};
  monthCache[ck][ds]=row;
}
function delCached(clientId,ds){
  const [y,mo]=ds.split('-').map(Number);
  const ck=cacheKey(clientId,y,mo-1);
  if(monthCache[ck]) delete monthCache[ck][ds];
}

/* ==============================
   SETUP / CONNECT
   ============================== */
async function connectSupabase(){
  const url=document.getElementById('setup-url').value.trim();
  const key=document.getElementById('setup-key').value.trim();
  const errEl=document.getElementById('setup-error');
  errEl.style.display='none';
  if(!url||!key){ showSetupError('URL と Anon Key を両方入力してください'); return; }
  if(!url.startsWith('https://')){ showSetupError('URL は https:// から始まる必要があります'); return; }
  SB_URL=url.replace(/\/$/,''); SB_KEY=key;
  try{
    const r=await fetch(`${SB_URL}/rest/v1/daily_reports?limit=1`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
    if(r.status===404||r.status===400){
      const b=await r.json().catch(()=>({}));
      if(b.message&&b.message.includes('relation')){
        showSetupError('テーブル "daily_reports" が見つかりません。\n以下のSQLをSupabase SQL Editorで実行してください：\n\n'+setupSQL());
        return;
      }
    }
    if(!r.ok&&r.status!==200){ showSetupError(`接続エラー (HTTP ${r.status})`); return; }
  }catch(e){ showSetupError('接続できません: '+e.message); return; }
  saveConfig(url,key);
  startApp();
}
function showSetupError(msg){ const e=document.getElementById('setup-error'); e.textContent=msg; e.style.display='block'; }
function setupSQL(){
  return `create table daily_reports (
  id bigserial primary key,
  client_id text not null,
  date_str text not null,
  title text default '',
  client text default '',
  time_start text default '',
  time_end text default '',
  tasks jsonb default '[]',
  work text default '',
  issue text default '',
  next_plan text default '',
  memo text default '',
  submitted boolean default false,
  updated_at timestamptz default now(),
  unique(client_id, date_str)
);`;
}

async function startApp(){
  document.getElementById('setup-wrap').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  clients = loadClients();
  renderClientList();
  if(clients.length>0) await selectClient(clients[0]);
}

/* ==============================
   CLIENT MANAGEMENT
   ============================== */
let editingClientId = null;
let selectedColor   = COLORS[0];

function renderClientList(){
  const ul=document.getElementById('client-list');
  ul.innerHTML='';
  if(clients.length===0){
    ul.innerHTML='<div style="padding:16px 10px;font-size:12px;color:var(--text3);text-align:center">クライアントがいません<br>下のボタンで追加</div>';
    return;
  }
  clients.forEach(c=>{
    const div=document.createElement('div');
    div.className='client-item'+(activeClient&&activeClient.id===c.id?' active':'');
    // count reports this month
    const ck=cacheKey(c.id,curYear,curMonth);
    const cnt=monthCache[ck]?Object.keys(monthCache[ck]).length:'';
    div.innerHTML=`
      <div class="client-avatar" style="background:${c.color}">${esc(c.abbr||c.name.slice(0,2))}</div>
      <span class="client-name" title="${esc(c.name)}">${esc(c.name)}</span>
      ${cnt?`<span class="client-count">${cnt}</span>`:''}
    `;
    div.onclick=()=>selectClient(c);
    div.ondblclick=()=>openEditClient(c);
    ul.appendChild(div);
  });
}

async function selectClient(c){
  activeClient=c;
  selectedDate=null;
  renderClientList();
  updateTopBar();
  setSyncStatus('syncing','読み込み中...');
  await loadMonth(c.id,curYear,curMonth).catch(()=>{});
  renderCalendar();
  updateStats();
  document.getElementById('form-area').innerHTML=`<div class="empty-state"><span class="empty-icon">📅</span><p>日付を選んで日報を記入</p></div>`;
  // auto-select today if same month
  if(curYear===now.getFullYear()&&curMonth===now.getMonth()) selectDate(todayStr);
}

function updateTopBar(){
  const el=document.getElementById('top-bar-left');
  if(!activeClient){ el.innerHTML='<div style="color:var(--text3);font-size:13px">クライアントを選択してください</div>'; return; }
  const c=activeClient;
  el.innerHTML=`
    <div class="client-badge">
      <div class="client-badge-avatar" style="background:${c.color}">${esc(c.abbr||c.name.slice(0,2))}</div>
      <div>
        <div class="client-badge-name">${esc(c.name)}</div>
        <div class="client-badge-meta">${curYear}年 ${MO[curMonth]}</div>
      </div>
    </div>
    <button class="btn btn-sm" style="margin-left:8px" onclick="openEditClient(activeClient)">✏ 編集</button>
  `;
}

function openAddClient(){
  editingClientId=null; selectedColor=COLORS[0];
  document.getElementById('client-modal-title').textContent='クライアントを追加';
  document.getElementById('cm-name').value='';
  document.getElementById('cm-abbr').value='';
  document.getElementById('cm-delete-btn').style.display='none';
  renderSwatches();
  document.getElementById('client-modal').classList.add('open');
  setTimeout(()=>document.getElementById('cm-name').focus(),50);
}
function openEditClient(c){
  editingClientId=c.id; selectedColor=c.color;
  document.getElementById('client-modal-title').textContent='クライアントを編集';
  document.getElementById('cm-name').value=c.name;
  document.getElementById('cm-abbr').value=c.abbr||'';
  document.getElementById('cm-delete-btn').style.display='inline-flex';
  renderSwatches();
  document.getElementById('client-modal').classList.add('open');
}
function closeClientModal(){ document.getElementById('client-modal').classList.remove('open'); }

function renderSwatches(){
  const wrap=document.getElementById('color-swatches');
  wrap.innerHTML='';
  COLORS.forEach(col=>{
    const s=document.createElement('div');
    s.className='swatch'+(col===selectedColor?' selected':'');
    s.style.background=col;
    s.onclick=()=>{ selectedColor=col; renderSwatches(); };
    wrap.appendChild(s);
  });
}

function saveClient(){
  const name=document.getElementById('cm-name').value.trim();
  const abbr=document.getElementById('cm-abbr').value.trim();
  if(!name){ alert('会社名を入力してください'); return; }
  if(editingClientId){
    const c=clients.find(c=>c.id===editingClientId);
    if(c){ c.name=name; c.abbr=abbr||name.slice(0,2); c.color=selectedColor; }
  }else{
    clients.push({id:uid(),name,abbr:abbr||name.slice(0,2),color:selectedColor});
  }
  persistClients(); closeClientModal(); renderClientList(); updateTopBar();
  showToast(editingClientId?'クライアントを更新しました':'クライアントを追加しました');
}

async function deleteClient(){
  const c=clients.find(c=>c.id===editingClientId);
  if(!c) return;
  if(!confirm(`「${c.name}」を削除しますか？\nSupabase 上の日報データは残ります。`)) return;
  clients=clients.filter(cl=>cl.id!==editingClientId);
  persistClients(); closeClientModal();
  if(activeClient&&activeClient.id===editingClientId){
    activeClient=null;
    document.getElementById('form-area').innerHTML=`<div class="empty-state"><span class="empty-icon">👈</span><p>クライアントを選択してください</p></div>`;
    updateTopBar();
  }
  renderClientList();
  showToast('クライアントを削除しました');
}

/* ==============================
   CALENDAR
   ============================== */
function renderCalendar(){
  document.getElementById('cal-title').textContent=`${curYear}年 ${MO[curMonth]}`;
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  DOW.forEach(d=>{ const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el); });
  const first=new Date(curYear,curMonth,1), last=new Date(curYear,curMonth+1,0);
  const startDow=first.getDay();
  for(let i=0;i<startDow;i++) addDay(grid,new Date(curYear,curMonth,1-startDow+i),true);
  for(let d=1;d<=last.getDate();d++) addDay(grid,new Date(curYear,curMonth,d),false);
  const rem=7-((startDow+last.getDate())%7);
  if(rem<7) for(let i=1;i<=rem;i++) addDay(grid,new Date(curYear,curMonth+1,i),true);
}

function addDay(grid,dt,other){
  const ds=fd(dt), el=document.createElement('div');
  el.className='cal-day';
  if(other) el.classList.add('other-month');
  if(ds===todayStr) el.classList.add('today');
  if(ds===selectedDate) el.classList.add('selected');
  if(activeClient&&getCached(activeClient.id,ds)) el.classList.add('has-report');
  const dow=dt.getDay();
  if(!other&&dow===0) el.classList.add('sunday');
  if(!other&&dow===6) el.classList.add('saturday');
  el.textContent=dt.getDate();
  el.onclick=()=>{ if(activeClient) selectDate(ds); };
  grid.appendChild(el);
}

async function changeMonth(dir){
  curMonth+=dir;
  if(curMonth>11){ curMonth=0; curYear++; }
  if(curMonth<0){  curMonth=11; curYear--; }
  selectedDate=null;
  updateTopBar();
  if(activeClient) await loadMonth(activeClient.id,curYear,curMonth).catch(()=>{});
  renderCalendar(); updateStats();
  document.getElementById('form-area').innerHTML=`<div class="empty-state"><span class="empty-icon">📅</span><p>日付を選んで日報を記入</p></div>`;
  renderClientList();
}

function updateStats(){
  if(!activeClient){ ['stat-count','stat-hours','stat-tasks'].forEach(id=>document.getElementById(id).textContent='—'); return; }
  const ck=cacheKey(activeClient.id,curYear,curMonth);
  const map=monthCache[ck]||{};
  let count=0,mins=0,done=0;
  Object.values(map).forEach(r=>{
    if(!r) return; count++;
    if(r.time_start&&r.time_end){
      const [sh,sm]=r.time_start.split(':').map(Number),[eh,em]=r.time_end.split(':').map(Number);
      const d=eh*60+em-sh*60-sm; if(d>0) mins+=d;
    }
    if(r.tasks) done+=r.tasks.filter(t=>t.done).length;
  });
  const h=Math.floor(mins/60),m2=mins%60;
  document.getElementById('stat-count').textContent=count;
  document.getElementById('stat-hours').textContent=m2>0?`${h}.${Math.round(m2/6)}`:`${h}`;
  document.getElementById('stat-tasks').textContent=done;
}

/* ==============================
   FORM
   ============================== */
async function selectDate(ds){
  if(!activeClient) return;
  selectedDate=ds; renderCalendar();
  const cached=getCached(activeClient.id,ds);
  renderForm(ds,cached);
  if(!cached){
    try{
      setSyncStatus('syncing','読み込み中...');
      const row=await sbSelect(activeClient.id,ds);
      setSyncStatus('ok','Supabase 接続済');
      if(row){ setCached(activeClient.id,ds,row); renderCalendar(); updateStats(); renderClientList(); if(selectedDate===ds) renderForm(ds,row); }
    }catch(e){ setSyncStatus('error','読み込みエラー'); }
  }
}

function renderForm(ds,row){
  if(!activeClient) return;
  const r=row?{
    title:row.title||'',client:row.client||activeClient.name,
    timeStart:row.time_start||'09:00',timeEnd:row.time_end||'18:00',
    tasks:row.tasks||[{text:'',done:false}],
    work:row.work||'',issue:row.issue||'',
    next:row.next_plan||'',memo:row.memo||'',submitted:row.submitted||false
  }:{
    title:'',client:activeClient.name,timeStart:'09:00',timeEnd:'18:00',
    tasks:[{text:'',done:false}],work:'',issue:'',next:'',memo:'',submitted:false
  };
  tasks=r.tasks.map(t=>({...t}));
  document.getElementById('form-area').innerHTML=`
    <div class="form-date-header">
      <div>
        <div class="form-date-label">${labelDate(ds)}</div>
        <div class="form-date-sub" id="form-client-sub">${r.client||activeClient.name}</div>
      </div>
      <span class="badge ${r.submitted?'badge-submitted':'badge-draft'}" id="status-badge">${r.submitted?'✓ 提出済':'下書き'}</span>
    </div>
    <div class="form-row">
      <div class="form-section">
        <label>タイトル</label>
        <input type="text" id="f-title" value="${esc(r.title)}" placeholder="本日の業務タイトル">
      </div>
      <div class="form-section">
        <label>クライアント名（PDF用）</label>
        <input type="text" id="f-client" value="${esc(r.client)}" placeholder="${esc(activeClient.name)}"
          oninput="document.getElementById('form-client-sub').textContent=this.value||activeClient.name">
      </div>
    </div>
    <div class="form-section">
      <label>作業時間</label>
      <div class="time-row">
        <input type="time" id="f-start" value="${esc(r.timeStart)}" oninput="calcHours()">
        <span class="time-sep">〜</span>
        <input type="time" id="f-end" value="${esc(r.timeEnd)}" oninput="calcHours()">
        <span class="time-calc" id="time-calc"></span>
      </div>
    </div>
    <div class="form-section">
      <label>タスク一覧</label>
      <ul class="task-list" id="task-list"></ul>
      <button class="add-task-btn" onclick="addTask()">＋ タスクを追加</button>
    </div>
    <div class="form-section">
      <label>作業内容・成果</label>
      <textarea id="f-work" rows="4" placeholder="実施した作業の詳細、達成した成果...">${esc(r.work)}</textarea>
    </div>
    <div class="form-row">
      <div class="form-section">
        <label>課題・問題点</label>
        <textarea id="f-issue" rows="3" placeholder="発生した問題・懸念事項...">${esc(r.issue)}</textarea>
      </div>
      <div class="form-section">
        <label>翌日の予定</label>
        <textarea id="f-next" rows="3" placeholder="明日実施予定の作業...">${esc(r.next)}</textarea>
      </div>
    </div>
    <div class="form-section">
      <label>連絡事項・メモ</label>
      <textarea id="f-memo" rows="2" placeholder="クライアントへの連絡事項など...">${esc(r.memo)}</textarea>
    </div>
    <div class="form-actions">
      <button class="btn btn-sm btn-danger" onclick="openDeleteModal()">🗑 削除</button>
      <span style="flex:1"></span>
      <button class="btn btn-sm" onclick="doSave(false)" id="btn-draft">💾 下書き保存</button>
      <button class="btn btn-sm btn-primary" onclick="doSave(true)" id="btn-submit">✓ 確定・提出済</button>
    </div>
  `;
  renderTasks(); calcHours();
}

function renderTasks(){
  const ul=document.getElementById('task-list'); if(!ul) return;
  ul.innerHTML='';
  tasks.forEach((t,i)=>{
    const li=document.createElement('li');
    li.className='task-item'+(t.done?' done-item':'');
    li.innerHTML=`
      <input type="checkbox" class="task-cb" ${t.done?'checked':''}
        onchange="tasks[${i}].done=this.checked;this.closest('li').classList.toggle('done-item',this.checked)">
      <input type="text" class="task-txt" value="${esc(t.text)}" placeholder="タスク内容"
        oninput="tasks[${i}].text=this.value" ${t.done?'style="text-decoration:line-through;color:var(--text3)"':''}>
      <button class="task-del" onclick="removeTask(${i})">×</button>`;
    ul.appendChild(li);
  });
}
function addTask(){ tasks.push({text:'',done:false}); renderTasks(); const ins=document.querySelectorAll('.task-txt'); if(ins.length) ins[ins.length-1].focus(); }
function removeTask(i){ tasks.splice(i,1); renderTasks(); }

function calcHours(){
  const s=document.getElementById('f-start')?.value, e=document.getElementById('f-end')?.value;
  const el=document.getElementById('time-calc'); if(!s||!e||!el) return;
  const [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);
  const mins=eh*60+em-sh*60-sm;
  el.textContent=mins>0?`${Math.floor(mins/60)}時間${mins%60?mins%60+'分':''}` : '';
}

function collectForm(submitted){
  return {
    client_id: activeClient.id,
    date_str: selectedDate,
    title:      document.getElementById('f-title')?.value||'',
    client:     document.getElementById('f-client')?.value||activeClient.name,
    time_start: document.getElementById('f-start')?.value||'',
    time_end:   document.getElementById('f-end')?.value||'',
    tasks:      tasks.map(t=>({...t})),
    work:       document.getElementById('f-work')?.value||'',
    issue:      document.getElementById('f-issue')?.value||'',
    next_plan:  document.getElementById('f-next')?.value||'',
    memo:       document.getElementById('f-memo')?.value||'',
    submitted,
    updated_at: new Date().toISOString()
  };
}

async function doSave(submitted){
  if(!selectedDate||!activeClient) return;
  const btnId=submitted?'btn-submit':'btn-draft';
  const btn=document.getElementById(btnId);
  if(btn){ btn.disabled=true; btn.textContent='保存中...'; }
  setSyncStatus('syncing','保存中...');
  try{
    const data=collectForm(submitted);
    await sbUpsert(data);
    setCached(activeClient.id,selectedDate,data);
    setSyncStatus('ok','Supabase 接続済');
    renderCalendar(); updateStats(); renderClientList();
    const badge=document.getElementById('status-badge');
    if(badge){ badge.className=`badge ${submitted?'badge-submitted':'badge-draft'}`; badge.textContent=submitted?'✓ 提出済':'下書き'; }
    showToast(submitted?'✓ 提出済として保存しました':'💾 下書きを保存しました');
  }catch(e){ setSyncStatus('error','保存エラー'); showToast('❌ 保存失敗: '+e.message); }
  finally{
    if(btn){ btn.disabled=false; btn.textContent=submitted?'✓ 確定・提出済':'💾 下書き保存'; }
  }
}

let deleteTarget=null;
function openDeleteModal(){ deleteTarget=selectedDate; document.getElementById('delete-modal').classList.add('open'); }
function closeDeleteModal(){ document.getElementById('delete-modal').classList.remove('open'); deleteTarget=null; }
async function confirmDelete(){
  if(!deleteTarget||!activeClient) return;
  closeDeleteModal();
  setSyncStatus('syncing','削除中...');
  try{
    await sbDelete(activeClient.id,deleteTarget);
    delCached(activeClient.id,deleteTarget);
    setSyncStatus('ok','Supabase 接続済');
    selectedDate=null; renderCalendar(); updateStats(); renderClientList();
    document.getElementById('form-area').innerHTML=`<div class="empty-state"><span class="empty-icon">🗑</span><p>削除しました</p></div>`;
    showToast('削除しました');
  }catch(e){ setSyncStatus('error','削除エラー'); showToast('❌ 削除失敗'); }
}

function printCSS(accentColor){
  return `
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Meiryo',sans-serif;
     font-size:10.5pt;color:#1a1a18;padding:18mm 20mm;line-height:1.8}
h1{font-size:15pt;text-align:center;margin-bottom:6mm;padding-bottom:4mm;
   border-bottom:2px solid ${accentColor}}
h2{font-size:11pt;text-align:center;color:#6B6860;margin-bottom:8mm}
.report{margin-bottom:10mm;padding-bottom:8mm;border-bottom:1px solid #E8E5DF;
        page-break-inside:avoid}
.report:last-child{border-bottom:none}
.r-header{border-left:4px solid ${accentColor};background:#F8FAF8;padding:3mm 5mm;
          margin-bottom:5mm;display:flex;justify-content:space-between;align-items:flex-start}
.r-date{font-size:11.5pt;font-weight:bold}
.r-client{font-size:9.5pt;color:#6B6860;margin-top:0.5mm}
.r-time{font-size:9.5pt;color:#0F6E56;font-weight:700}
.bsub{background:#E1F5EE;color:#085041;padding:1mm 3mm;border-radius:3px;
      font-size:8pt;font-weight:700;display:inline-block;margin-top:1mm}
.bdraft{background:#FAEEDA;color:#BA7517;padding:1mm 3mm;border-radius:3px;
        font-size:8pt;font-weight:700;display:inline-block;margin-top:1mm}
.sec{margin-bottom:4mm;page-break-inside:avoid}
.slabel{font-size:8.5pt;font-weight:bold;color:#6B6860;
        border-bottom:0.5px solid #E8E5DF;padding-bottom:0.8mm;
        margin-bottom:2mm;letter-spacing:.05em}
/* ★ テキストは <div> で展開 — 高さ制限なし、全文表示 */
.sval{font-size:10pt;white-space:pre-wrap;word-break:break-word;
      line-height:1.8;min-height:1em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:5mm;margin-bottom:4mm}
.tr{display:flex;gap:3mm;padding:1.5mm 0;border-bottom:.5px solid #F0EDE7;font-size:10pt}
.tc{width:10pt;height:10pt;border:1.5px solid #1D9E75;border-radius:2px;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:8pt;color:#1D9E75;margin-top:1.5pt}
@media print{body{padding:12mm 15mm}}
  `;
}

// 1件分のレポートHTML（<div>ベース — textareaを使わない）
function buildReportHTML(r, clientName){
  let mins=0;
  if(r.time_start&&r.time_end){
    const [sh,sm]=r.time_start.split(':').map(Number),[eh,em]=r.time_end.split(':').map(Number);
    mins=Math.max(0,eh*60+em-sh*60-sm);
  }
  const hh=Math.floor(mins/60),mm2=mins%60;
  const tl=mins>0?`${r.time_start}〜${r.time_end}（${hh}時間${mm2?mm2+'分':''}）`:`${r.time_start||''}〜${r.time_end||''}`;
  const dt=parseDate(r.date_str);
  const dl=`${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日（${DOW[dt.getDay()]}）${r.title?' — '+sh(r.title):''}`;
  let html=`<div class="report">
    <div class="r-header">
      <div>
        <div class="r-date">${dl}</div>
        <div class="r-client">${sh(r.client||clientName)}</div>
      </div>
      <div style="text-align:right">
        <div class="r-time">${sh(tl)}</div>
        <span class="${r.submitted?'bsub':'bdraft'}">${r.submitted?'✓ 提出済':'下書き'}</span>
      </div>
    </div>`;
  const vt=(r.tasks||[]).filter(t=>t.text);
  if(vt.length){
    html+=`<div class="sec"><div class="slabel">タスク</div>`;
    vt.forEach(t=>{ html+=`<div class="tr"><div class="tc">${t.done?'✓':''}</div><div>${sh(t.text)}</div></div>`; });
    html+=`</div>`;
  }
  // ★ textareaの代わりに <div class="sval"> で全文展開
  if(r.work) html+=`<div class="sec"><div class="slabel">作業内容・成果</div><div class="sval">${sh(r.work)}</div></div>`;
  if(r.issue||r.next_plan){
    html+=`<div class="g2">`;
    if(r.issue)     html+=`<div class="sec"><div class="slabel">課題・問題点</div><div class="sval">${sh(r.issue)}</div></div>`;
    if(r.next_plan) html+=`<div class="sec"><div class="slabel">翌日の予定</div><div class="sval">${sh(r.next_plan)}</div></div>`;
    html+=`</div>`;
  }
  if(r.memo) html+=`<div class="sec"><div class="slabel">連絡事項</div><div class="sval">${sh(r.memo)}</div></div>`;
  html+=`</div>`;
  return { html, mins, doneTasks: vt.filter(t=>t.done).length };
}

// 1日分の印刷
async function printCurrent(){
  if(!selectedDate){ alert('日付を選択してください'); return; }
  if(!activeClient) return;
  // 最新データを取得（未保存の場合はキャッシュ or フォームから読む）
  let row = getCached(activeClient.id, selectedDate);
  if(!row){
    try{ row = await sbSelect(activeClient.id, selectedDate); }catch(e){}
  }
  if(!row){
    // フォームの内容をそのまま使う（未保存でも印刷可能）
    row = {
      date_str: selectedDate,
      title:      document.getElementById('f-title')?.value||'',
      client:     document.getElementById('f-client')?.value||activeClient.name,
      time_start: document.getElementById('f-start')?.value||'',
      time_end:   document.getElementById('f-end')?.value||'',
      tasks:      tasks.map(t=>({...t})),
      work:       document.getElementById('f-work')?.value||'',
      issue:      document.getElementById('f-issue')?.value||'',
      next_plan:  document.getElementById('f-next')?.value||'',
      memo:       document.getElementById('f-memo')?.value||'',
      submitted:  false
    };
  }
  const { html } = buildReportHTML(row, activeClient.name);
  const win = window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
    <title>${activeClient.name} ${labelDate(selectedDate)} 業務日報</title>
    <style>${printCSS(activeClient.color)}</style></head>
    <body>${html}</body></html>`);
  win.document.close();
  setTimeout(()=>win.print(), 400);
}

// 月次PDF
async function exportMonthPDF(){
  if(!activeClient){ alert('クライアントを選択してください'); return; }
  setSyncStatus('syncing','取得中...');
  let reports;
  try{ reports=await sbSelectMonth(activeClient.id,curYear,curMonth); setSyncStatus('ok','Supabase 接続済'); }
  catch(e){ setSyncStatus('error','エラー'); alert('取得失敗: '+e.message); return; }
  if(!reports.length){ alert('今月の日報がありません'); return; }

  let body='', totalMins=0, doneTasks=0;
  reports.forEach(r=>{
    const res = buildReportHTML(r, activeClient.name);
    body += res.html;
    totalMins += res.mins;
    doneTasks += res.doneTasks;
  });

  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
    <title>${activeClient.name} ${curYear}年${MO[curMonth]} 業務日報</title>
    <style>${printCSS(activeClient.color)}</style></head>
    <body>
      <h1>${sh(activeClient.name)}</h1>
      <h2>${curYear}年${MO[curMonth]}　業務日報　／　${reports.length}件・稼働${Math.floor(totalMins/60)}時間・完了タスク${doneTasks}件</h2>
      ${body}
    </body></html>`);
  win.document.close();
  setTimeout(()=>win.print(), 600);
}
